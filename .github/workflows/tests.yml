name: Tests

on:
  push:
    branches:
      - edge
      - main
  pull_request:
  # Allow other workflows (e.g. the release/publish flow) to run this as a gate.
  workflow_call:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check src tests

  test:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        # The unit tests never launch a real browser, so we install only the
        # light runtime deps the connector imports at module load -- not the
        # heavy camoufox/playwright browser binaries. This keeps the gate fast
        # and reliable.
        run: |
          python -m pip install --upgrade pip
          pip install "pydantic>=2.0.0" "pydantic-settings>=2.0.0" \
                      "starlette>=0.35.0" "httpx>=0.26.0" "uvicorn>=0.25.0" \
                      pytest pytest-asyncio

      - name: Run tests
        run: PYTHONPATH=src python -m pytest tests -v
